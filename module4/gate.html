<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Врата Памяти</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #050208 0%, #0f051c 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Эффект яростной тряски экрана при финальном открытии */
        @keyframes matrix-shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -2px); }
            60% { transform: translate(-3px, -3px); }
            80% { transform: translate(3px, 2px); }
        }
        .shake-active {
            animation: matrix-shake 0.25s linear infinite;
        }

        .ambient-glow {
            position: fixed;
            width: 120vw;
            height: 120vw;
            background: radial-gradient(circle, rgba(179,2,42,0.05) 0%, rgba(15,5,28,0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        .gate-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
            text-align: center;
        }

        .hint-title {
            font-size: 0.95rem;
            color: #a0a0a0;
            line-height: 1.6;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
            font-weight: 300;
            transition: opacity 1s ease;
        }

        /* Дизайн Врат */
        .gate-visual {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .node {
            width: 110px;
            padding: 12px 5px;
            background: rgba(26, 11, 46, 0.4);
            border: 1px solid rgba(179, 2, 42, 0.2);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #8a8a8a;
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Когда нода загорается при совпадении имени */
        .node.active {
            color: #ffffff;
            border-color: #b3022a;
            background: rgba(74, 3, 20, 0.3);
            box-shadow: 0 0 20px rgba(179, 2, 42, 0.5), inset 0 0 8px rgba(179, 2, 42, 0.3);
            text-shadow: 0 0 8px #ffb3c1;
        }

        .center-line {
            position: absolute;
            left: 110px;
            right: 110px;
            height: 2px;
            background: rgba(179, 2, 42, 0.1);
            transition: all 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-line::after {
            content: '×';
            font-size: 1.2rem;
            color: rgba(179, 2, 42, 0.4);
            background: #0f051c;
            padding: 0 10px;
            transition: all 0.5s ease;
        }

        /* Состояние успеха для визуализации ворот (Линия загорается) */
        .gate-visual.success .center-line {
            background: #b3022a;
            box-shadow: 0 0 15px #b3022a;
        }

        .gate-visual.success .center-line::after {
            content: '♥';
            color: #ffffff;
            text-shadow: 0 0 10px #b3022a;
            transform: scale(1.4);
            background: #090311;
        }

        /* Поля ввода */
        .inputs-block {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
            transition: opacity 1s ease;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 10, 35, 0.7);
            border: 1px solid rgba(179, 2, 42, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.4s ease;
        }

        .input-field:focus {
            border-color: rgba(179, 2, 42, 0.6);
            background: rgba(26, 11, 46, 0.9);
            box-shadow: 0 0 12px rgba(179, 2, 42, 0.2);
        }

        /* Стиль для успешно заполненного инпута */
        .input-field.success {
            border-color: rgba(179, 2, 42, 0.4);
            background: rgba(18, 7, 28, 0.8);
            color: #8a8a8a;
            box-shadow: none;
        }

        /* Кнопка */
        .action-btn {
            width: 100%;
            padding: 15px;
            background: #230811;
            color: #666;
            border: 1px solid rgba(179, 2, 42, 0.2);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Активированная готовая кнопка (Пульсирует неоном) */
        .action-btn.ready {
            background: linear-gradient(90deg, #b3022a 0%, #72021b 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 20px rgba(179, 2, 42, 0.5);
            animation: pulseBtn 1.5s infinite alternate;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 12px rgba(179, 2, 42, 0.4); transform: scale(1); }
            100% { box-shadow: 0 0 25px rgba(179, 2, 42, 0.7); transform: scale(1.02); }
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Статус-сообщение */
        .status-msg {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 20px;
            color: #b3022a;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .status-msg.visible {
            opacity: 1;
        }
        
        .status-msg.success-text {
            color: #ffb3c1;
            text-shadow: 0 0 10px rgba(179,2,42,0.6);
        }

        /* Вспышка на весь экран при разблокировке */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .flash-overlay.active {
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="flash-overlay" id="flash"></div>

    <div class="gate-container" id="mainContainer">
        <div class="hint-title" id="hintText">
            Некоторые вещи невозможно угадать.<br>Их можно только помнить.<br><br>
            <span style="font-size: 0.85rem; color: #6e6e6e;">Подсказка: Вспомни, кто создал этот мир и для кого он создавался.</span>
        </div>

        <div class="gate-visual" id="gateVisual">
            <div class="node" id="node1">???</div>
            <div class="center-line"></div>
            <div class="node" id="node2">???</div>
        </div>

        <div class="inputs-block" id="inputsBlock">
            <input type="text" class="input-field" id="val1" placeholder="Первое имя / ник" autocomplete="off" spellcheck="false">
            <input type="text" class="input-field" id="val2" placeholder="Второе имя / ник" autocomplete="off" spellcheck="false">
        </div>

        <button class="action-btn" id="submitBtn" onclick="checkGate()">Сделать последний шаг</button>
        
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // Списки валидных значений (полный набор форматов из обоих вариантов кода)
        const gName = ["gustav", "густав", "Gustav"];
        const eName = ["ketsu", "кецу", "ketsunebo", "кетцу", "кецунебо"];

        // Состояние распознавания полей (g - густав, e - эльвира, null - не разгадано)
        let tracking = { val1: null, val2: null };

        // Звуковой движок (Синтезирует *Пшшш-гууух* через Web Audio API)
        function playGateSound(isFinal = false) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // 1. Белый шум (эффект разжатия воздуха *Пшшш*)
                const bufferSize = ctx.sampleRate * (isFinal ? 2.2 : 1.2);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isFinal ? 1100 : 900, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + (isFinal ? 1.8 : 1.0));

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(isFinal ? 0.35 : 0.25, ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (isFinal ? 2.0 : 1.1));

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(ctx.destination);

                // 2. Низкочастотный басовый гул ворот (*Гууух*)
                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(isFinal ? 95 : 80, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(35, ctx.currentTime + (isFinal ? 1.4 : 0.7));

                const lowpass2 = ctx.createBiquadFilter();
                lowpass2.type = 'lowpass';
                lowpass2.frequency.setValueAtTime(130, ctx.currentTime);

                oscGain.gain.setValueAtTime(isFinal ? 0.45 : 0.25, ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (isFinal ? 2.1 : 1.2));

                osc.connect(lowpass2);
                lowpass2.connect(oscGain);
                oscGain.connect(ctx.destination);

                noise.start();
                osc.start();
                noise.stop(ctx.currentTime + (isFinal ? 2.2 : 1.2));
                osc.stop(ctx.currentTime + (isFinal ? 2.2 : 1.2));
            } catch (e) {
                console.log("Аудио-контекст заблокирован до взаимодействия.");
            }
        }

        // Проверка полей на лету (позволяет нодам загораться по отдельности)
        function checkInputsLive() {
            const v1 = document.getElementById('val1').value.toLowerCase().trim();
            const v2 = document.getElementById('val2').value.toLowerCase().trim();

            // Проверяем первый инпут, если он еще не зафиксирован
            if (!tracking.val1) {
                if (gName.includes(v1) && tracking.val2 !== 'g') {
                    tracking.val1 = 'g';
                    lockAndLightUp('val1', 'node1', 'GUSTAV');
                } else if (eName.includes(v1) && tracking.val2 !== 'e') {
                    tracking.val1 = 'e';
                    lockAndLightUp('val1', 'node1', v1.toUpperCase());
                }
            }

            // Проверяем второй инпут, если он еще не зафиксирован
            if (!tracking.val2) {
                if (gName.includes(v2) && tracking.val1 !== 'g') {
                    tracking.val2 = 'g';
                    lockAndLightUp('val2', 'node2', 'GUSTAV');
                } else if (eName.includes(v2) && tracking.val1 !== 'e') {
                    tracking.val2 = 'e';
                    lockAndLightUp('val2', 'node2', v2.toUpperCase());
                }
            }

            // Если оба ключа подошли — активируем Врата полностью
            if (tracking.val1 && tracking.val2) {
                document.getElementById('gateVisual').classList.add('success');
                document.getElementById('submitBtn').classList.add('ready');
            }
        }

        // Функция фиксации одного верного поля
        function lockAndLightUp(inputId, nodeId, displayName) {
            const inputEl = document.getElementById(inputId);
            const nodeEl = document.getElementById(nodeId);

            inputEl.classList.add('success');
            inputEl.readOnly = true; // Блокируем поле от изменений
            
            nodeEl.innerText = displayName;
            nodeEl.classList.add('active'); // Зажигаем ноду сверху

            playGateSound(false); // Одиночный звук активации ноды
        }

        // Вешаем слушатели событий на ввод текста
        document.getElementById('val1').addEventListener('input', checkInputsLive);
        document.getElementById('val2').addEventListener('input', checkInputsLive);

        // Функция финального клика по кнопке
        function checkGate() {
            // Страховка на случай, если автопроверка не успела сработать
            checkInputsLive();

            if (tracking.val1 && tracking.val2) {
                sessionStorage.setItem("final_gate", "opened");

                // Запуск финального супер-эффекта ворот
                playGateSound(true); // Мощный долгий звук шлюза
                document.body.classList.add('shake-active'); // Тряска экрана

                // Белая вспышка через 400мс
                setTimeout(() => {
                    document.getElementById('flash').classList.add('active');
                }, 400);

                // Плавное исчезновение всего интерфейса
                document.getElementById('inputsBlock').style.opacity = "0";
                document.getElementById('inputsBlock').style.pointerEvents = "none";
                document.getElementById('submitBtn').style.opacity = "0";
                document.getElementById('submitBtn').style.pointerEvents = "none";
                document.getElementById('hintText').style.opacity = "0";

                const statusMsg = document.getElementById('statusMsg');
                statusMsg.innerText = "Доступ подтверждён. Последняя дверь открыта.";
                statusMsg.className = "status-msg visible success-text";

                // Задержка перед переходом на финал для сохранения атмосферы кино
                setTimeout(() => {
                    window.location.href = "page5.html";
                }, 3500);

            } else {
                // Если кнопка нажата до ввода обоих паролей — визуальная ошибка кнопки
                const statusMsg = document.getElementById('statusMsg');
                statusMsg.innerText = "Врата не откликнулись. Введите оба ключа.";
                statusMsg.className = "status-msg visible";
                
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.style.transform = 'translateX(-8px)';
                setTimeout(() => submitBtn.style.transform = 'translateX(8px)', 80);
                setTimeout(() => submitBtn.style.transform = 'translateX(0)', 160);
            }
        }
    </script>
</body>
</html>
